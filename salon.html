<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Hair salon CRM · Portals Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a Portals shell bar (pick a business, pick a screen) over a large mockup stage, with a notes drawer. Single light look on purpose: these are product mockups. */
:root{
  --teal:#174C4F; --teal-ink:#0F3537; --paper:#F7F4ED; --card:#FFFFFF; --ink:#252D32; --muted:#55605F;
  --line:#E4DED0; --soft:#FBF9F4; --coral:#C2533F; --sand:#EDE8DC;
  --display:'Manrope',system-ui,sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #2E5A88;outline-offset:2px}
a{color:var(--teal)}
.shell{max-width:1440px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--teal)}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;line-height:1}
.brand small{display:block;font-family:var(--display);font-weight:700;font-size:12px;color:#3A4448;letter-spacing:.04em}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.spacer{flex:1}
.notesbtn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--teal);background:var(--card);color:var(--teal);font-weight:700;cursor:pointer}
.picker{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pick{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px}
.pick i{width:12px;height:12px;border-radius:4px;display:inline-block}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.views{display:flex;flex-wrap:wrap;gap:6px;padding:5px;border-radius:14px;background:var(--sand);align-self:flex-start}
.view{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:transparent;font-weight:700;cursor:pointer}
.view[aria-pressed="true"]{background:var(--teal);color:#fff}
.stagewrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.stage{flex:999 1 640px;min-width:0}
.notes{flex:1 1 300px;max-width:420px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.notes h2{margin:0;font-family:var(--display);font-size:18px}
.notes p{margin:0;font-size:14px;color:var(--muted)}
.notes textarea{width:100%;min-height:180px;font:16px var(--body);padding:10px 12px;border-radius:10px;border:1.5px solid #CFC8B8;background:var(--soft);resize:vertical}
.notes .row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--coral);color:#fff;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid #D9D3C4}
.saved{font-size:13px;color:#1F5C38;font-weight:700;min-height:18px}
.allnotes{font-size:14px;max-height:200px;overflow:auto;background:var(--soft);border-radius:10px;padding:10px;white-space:pre-wrap;border:1px solid var(--line)}

/* ---------- desk mockup ---------- */
.desk{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(23,76,79,.08);min-height:760px}
.side{flex:1 1 220px;max-width:100%;padding:22px 14px;color:#F7F4ED;display:flex;flex-direction:column;gap:3px}
.side .who{display:flex;align-items:center;gap:12px;padding:0 8px 18px}
.mono{width:44px;height:44px;border-radius:10px;background:#F7F4ED;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;flex:none}
.side .nm{font-family:var(--display);font-weight:800;font-size:16px;line-height:1.2}
.side .kd{font-size:13px;opacity:.85}
.navi{display:flex;align-items:center;padding:11px 14px;border-radius:10px;font-weight:600;color:#F7F4ED;background:transparent;border:0;width:100%;text-align:left;font-size:16px;cursor:pointer;min-height:44px}.navi:hover{background:rgba(247,244,237,.10)}
.sec-table{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}.sec-table th{text-align:left;font-size:13px;color:var(--muted);padding:10px 12px;background:var(--soft)}.sec-table td{padding:12px;border-top:1px solid #EFEAE0}
.feats{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.feats h2{margin:0;font-family:var(--display);font-size:18px}.feats p{margin:0;font-size:14px;color:var(--muted)}
.fchip{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid #D9D3C4;background:#fff;font-weight:700;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fchip .dot{width:18px;height:18px;border-radius:6px;border:2px solid #B8B0A0;display:grid;place-items:center;font-size:12px;color:#fff}
.fchip.inc{cursor:default;background:var(--soft);color:var(--muted)}
.addf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:12px;border-radius:12px;background:#FFF8E8;border:1.5px dashed #E0B43A}
.addf label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700}
.addf input,.addf select{font:16px var(--body);min-height:42px;padding:0 10px;border-radius:9px;border:1.5px solid #CFC8B8;background:#fff}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EFEAE0}
.navi.on{background:rgba(247,244,237,.16);font-weight:700}
.navi span{margin-left:auto;font-size:13px;font-weight:700}
.main{flex:999 1 560px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px}
.hd{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between}
.hd p{margin:0;font-size:15px;color:var(--muted)}
.hd h1{margin:4px 0 0;font-family:var(--display);font-weight:800;font-size:32px;text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.tile b{font-family:var(--display);font-weight:800;font-size:30px}
.tile strong{font-size:16px}
.tile span{font-size:14px;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2{margin:0;font-family:var(--display);font-weight:800;font-size:19px}
.left{flex:3 1 480px}
.right{flex:2 1 300px;min-width:0;display:flex;flex-direction:column;gap:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 12px;border-radius:999px;border:1.5px solid #D9D3C4;background:var(--card);font-weight:600;font-size:14px;cursor:pointer}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) minmax(120px,160px);gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--soft);border:1px solid #EEE8DA}
.item .t{font-family:var(--display);font-weight:700;font-size:15px}
.item .w{font-weight:700}
.item .w small{font-weight:400;color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.bdg{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog div{height:8px}
.stat{font-size:13px;font-weight:700}
.vs{padding:0;overflow:hidden}
.vs h2{padding:18px 20px 10px}
.vsg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.vsg>div{padding:14px 20px 18px;display:flex;flex-direction:column;gap:8px}
.vsg .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.saved-h{margin-top:4px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.16);font-weight:700}
.rowx{display:flex;justify-content:space-between;gap:10px;align-items:center}
.rowx small{display:block;color:var(--muted);font-size:14px}

/* ---------- phone mockups ---------- */
.phonestage{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start;justify-content:center;padding:10px 0}
.phone{width:390px;max-width:100%;height:800px;border-radius:44px;background:#1E2428;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.18);flex:none}
.screen{height:100%;border-radius:34px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.ph-top{padding:18px 16px 12px;color:#fff;display:flex;flex-direction:column;gap:5px}
.ph-top b{font-family:var(--display);font-weight:800;font-size:19px}
.ph-top span{font-size:14px;opacity:.92}
.ph-prog{height:10px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.ph-prog div{height:10px;background:#fff}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .chip{flex:none}
.ph-body{flex:1;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.task{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:12px}
.box{flex:none;width:44px;height:44px;border-radius:10px;border:2px solid #B8B0A0;background:#fff;font:800 20px var(--display);color:#fff;cursor:pointer}
.task .tx{flex:1;font-size:15px;font-weight:700}
.task .tx.done{font-weight:400;color:var(--muted);text-decoration:line-through}
.cam{flex:none;font-size:12px;font-weight:800;padding:4px 8px;border-radius:999px}
.rate{border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;border:2px solid var(--line);background:var(--card)}
.rate .tx{font-weight:700;font-size:15px}
.rbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.rb{min-height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
.ph-note{padding:10px 12px;border-radius:12px;background:#FFF3CC;color:#6E4D00;font-size:14px;font-weight:700}
.ph-foot{padding:10px 12px 16px;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.big{min-height:52px;border:0;border-radius:12px;background:var(--coral);color:#fff;font:800 17px var(--display);cursor:pointer}
.ok{padding:10px 12px;border-radius:10px;background:#E3F1E7;color:#1F5C38;font-weight:700;font-size:14px}
.side-note{flex:1 1 260px;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.side-note h3{margin:0;font-family:var(--display);font-size:17px}
.side-note p{margin:0;font-size:15px;color:#3A4448}

/* customer */
.cust-h{padding:14px 16px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cust-h .mono{color:#fff;width:40px;height:40px;font-size:13px}
.cust-h b{font-family:var(--display);font-weight:800;font-size:17px;display:block}
.cust-h small{font-size:13px;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>span{font-weight:700;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.opt{min-height:44px;padding:4px 10px;border-radius:10px;border:1.5px solid #D9D3C4;background:#fff;font-weight:700;font-size:14px;cursor:pointer;line-height:1.2}
.cnt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.cnt button{width:40px;height:40px;border-radius:8px;border:1.5px solid #D9D3C4;background:#fff;font:800 18px var(--display);cursor:pointer}
.price{display:flex;justify-content:space-between;align-items:baseline}
.price span{font-size:14px;color:var(--muted)}
.price b{font-family:var(--display);font-weight:800;font-size:30px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sum div{padding:10px;border-radius:12px;display:flex;flex-direction:column;font-weight:700;font-size:13px}
.sum b{font-family:var(--display);font-size:26px}
.alert{border-radius:14px;overflow:hidden;border:2px solid}
.alert .ah{padding:8px 12px;font-weight:800;font-family:var(--display);font-size:14px}
.alert .ab{padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#fff;font-size:14px}
.ph-photo{height:96px;border-radius:10px;background:#D7DEE2;display:grid;place-items:center;font-size:13px;color:#3A4448;font-weight:600}
.lnk{min-height:40px;display:inline-flex;align-items:center;justify-content:center;padding:0 12px;border-radius:9px;font-weight:700;font-size:14px;border:1.5px solid #D9D3C4;background:#fff;cursor:pointer}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid #ECE6D9;background:#fff;font-size:14px}
.lrow .bdg{min-width:74px;text-align:center}
.line{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0;border-bottom:1px solid #EFEAE0;font-variant-numeric:tabular-nums}
.sig{width:100%;min-height:44px;font:22px 'Source Sans 3',cursive;padding:0 12px;border-radius:10px;border:1.5px dashed #B8B0A0;background:#fff;font-style:italic}

@media (max-width:640px){
  .main{padding:20px 16px}
  .item{grid-template-columns:52px minmax(0,1fr)}
  .item>div:last-child{grid-column:1/-1}
  .notes{position:static;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="bar">

      <div class="saved" id="savedMsg" aria-live="polite"></div>
      <div class="row">
        <button class="btn" type="button" id="copyAll">Copy all notes</button>

      </div>
      <div class="allnotes" id="allNotes" hidden></div>
      <p>Paste your copied notes to Claude and the changes get made.</p>
    </aside>
  </div>
</div>

  const chip = (id, label) => `<button type="button" class="chip" data-act="team" data-v="${esc(id)}" aria-pressed="${s.team===id}" style="${s.team===id?`background:${b.accent};border-color:${b.accent};color:#fff`:''}">${esc(label)}</button>`;
  return `<div class="desk">
    <nav class="side" aria-label="${esc(b.name)} menu" style="background:${b.accent}">
      <div class="who"><span class="mono" style="color:${b.accent}">${esc(b.short)}</span><span><span class="nm">${esc(b.name)}</span><br><span class="kd">${esc(b.kind)}</span></span></div>
      ${b.nav.map((n,i)=>has(s,featOf(n[0]))?`<button type="button" class="navi${i===s.nav?' on':''}" data-act="nav" data-v="${i}" aria-current="${i===s.nav?'page':'false'}">${esc(n[0])}<span>${esc(n[1])}</span></button>`:'').join('')}
    </nav>
    ${s.nav ? renderSection(b, s) : `<div class="main">
      <div class="hd"><div><p>Tuesday, November 3</p><h1>Good morning, ${esc(b.owner)}</h1></div>
        <div class="chips"><button type="button" class="btn" data-act="openAdd" data-v="job">+ New ${b.customer.mode==='book'?'booking':'job'}</button></div></div>
      <section class="tiles" aria-label="At a glance">${b.tiles.filter(t=>has(s,featOf(t[1]))).map(t=>`<div class="tile"><b style="color:${t[3]?'#C2533F':b.accent}">${esc(t[0])}</b><strong>${esc(t[1])}</strong><span>${esc(t[2])}</span></div>`).join('')}</section>
      <div class="cols">
        <section class="panel left" aria-label="${esc(b.listTitle)}">
          ${s.addOpen==='job'?addForm(b):''}<div class="rowx" style="flex-wrap:wrap"><h2>${esc(b.listTitle)}</h2><div class="chips" role="group" aria-label="Filter">${chip('all','All')}${b.teams.map(t=>chip(t,t)).join('')}</div></div>
          ${items.map(i=>`<div class="item"><span class="t">${esc(i[0])}</span><div style="min-width:0"><div class="w">${esc(i[1])} <small>· ${esc(i[2])}</small></div><div class="badges">${badgeFor(b,i[3])}<span class="bdg" style="background:#E8EDF0;color:#2C3A43">${esc(i[4])}</span>${i[7]?`<span class="bdg" style="background:#FFF3CC;color:#6E4D00">${esc(i[7])}</span>`:''}</div></div>
            <div style="display:flex;flex-direction:column;gap:4px"><span class="stat" style="color:${i[5]===100?'#1F5C38':i[5]>0?'#24486B':'#55605F'}">${esc(i[6])}</span><div class="prog"><div style="width:${i[5]}%;background:${i[5]===100?'#2E7D4F':b.accent}"></div></div></div></div>`).join('')}
        </section>
        <div class="right">
          <section class="panel vs" aria-label="October: you vs your CRM"><h2>October: you vs. your CRM</h2>
            <div class="vsg"><div style="background:var(--soft)"><span class="lab" style="color:var(--muted)">What you did</span>${b.you.map(k=>`<div class="kv"><span>${esc(k[0])}</span><strong>${esc(k[1])}</strong></div>`).join('')}</div>
            <div style="background:${b.accent};color:#F7F4ED"><span class="lab">What your CRM did</span>${b.crm.filter(k=>has(s,featOf(k[0]))).map(k=>`<div class="kv"><span>${esc(k[0])}</span><strong>${esc(k[1])}</strong></div>`).join('')}<div class="saved-h">About ${b.saved} hours of office work saved</div></div></div></section>
          ${has(s,featOf(b.side.title))?`<section class="panel" aria-label="${esc(b.side.title)}"><h2>${esc(b.side.title)}</h2>${b.side.rows.concat(s.stock).map(r=>`<div class="rowx"><span>${esc(r[0])}</span>${lvlBadge(r[2],r[1])}</div>`).join('')}</section>`:''}
          ${has(s,featOf(b.side2.title))?`<section class="panel" aria-label="${esc(b.side2.title)}"><h2>${esc(b.side2.title)}</h2>${b.side2.rows.map(r=>`<div class="rowx"><span><strong>${esc(r[0])}</strong><small>${esc(r[1])}</small></span><button type="button" class="lnk">Open</button></div>`).join('')}</section>`:''}
        </div>

}

function addForm(b){
  const types = [...new Set(b.items.map(i => i[3]))];
  return `<div class="addf" role="group" aria-label="Add new"><label>Customer name<input id="fName" placeholder="Name" autocomplete="off"></label><label>Town or note<input id="fWhere" placeholder="Eden"></label><label>Type<select id="fType">${types.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><label>Time<input id="fTime" placeholder="2:00"></label><label>Who goes<select id="fTeam">${b.teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></label><div style="display:flex;gap:8px;align-items:flex-end"><button type="button" class="btn" data-act="saveAdd">Save</button><button type="button" class="btn ghost" data-act="openAdd" data-v="">Cancel</button></div></div>`;
}
function stockForm(){
  return `<div class="addf" role="group" aria-label="Add item"><label>Item<input id="sName" placeholder="Item name"></label><label>How much is left<select id="sLvl"><option value="g">Plenty</option><option value="y">Getting low</option><option value="r">Out / order now</option></select></label><div style="display:flex;gap:8px;align-items:flex-end"><button type="button" class="btn" data-act="saveStock">Save</button><button type="button" class="btn ghost" data-act="openAdd" data-v="">Cancel</button></div></div>`;
}
function renderSection(b, s){
  const label = b.nav[s.nav][0], L = label.toLowerCase();
  const back = `<button type="button" class="btn ghost" data-act="nav" data-v="0">← Back to Today</button>`;
  let body = '';
  if (/website/.test(L)) body = `<section class="panel"><h2>How your website connects</h2>
    <div class="rowx"><span><strong>1. Contact and "Request a showing" forms</strong><small>The forms on your website send people straight here, marked "Website." No copying from email.</small></span></div>
    <div class="rowx"><span><strong>2. Your listing search</strong><small>The home search on your site (from your broker or MLS) has an "Ask about this home" button. The lead lands here with that home attached.</small></span></div>
    <div class="rowx"><span><strong>3. Instant text back</strong><small>Within a minute the lead gets a text from you, and they go on your follow-up list so no one slips through.</small></span></div></section>
    <section class="panel"><h2>Leads</h2><div style="overflow-x:auto"><table class="sec-table"><thead><tr><th>Name</th><th>What they want</th><th>Came from</th><th>Status</th></tr></thead><tbody>${s.leads.map(l=>`<tr><td><strong>${esc(l[0])}</strong></td><td>${esc(l[1])}</td><td><span class="bdg" style="background:${l[2]==='Website'?'#E3EBF3':'#EDE8DC'};color:${l[2]==='Website'?'#24486B':'#3A4448'}">${esc(l[2])}</span></td><td>${esc(l[3])}</td></tr>`).join('')}</tbody></table></div></section>`;
  else if (/open house/.test(L)) body = `<section class="panel"><h2>Open house sign-in</h2><p style="margin:0;color:var(--muted)">Visitors sign in on your phone or a tablet at the door. Each one goes straight to your leads.</p>
    <div class="addf" role="group" aria-label="Sign in"><label>Name<input id="oName" placeholder="Visitor name" autocomplete="off"></label><label>What are they looking for?<input id="oWant" placeholder="3 bed in Eden"></label><label>Working with an agent?<select id="oAgent"><option>No</option><option>Yes</option></select></label><div style="display:flex;align-items:flex-end"><button type="button" class="btn" data-act="saveOpen">Sign in</button></div></div>
    ${s.leads.filter(l=>l[2]==='Open house').map(l=>`<div class="rowx"><span><strong>${esc(l[0])}</strong><small>${esc(l[1])}</small></span><span class="bdg" style="background:#EDE8DC;color:#3A4448">${esc(l[3])}</span></div>`).join('')}</section>`;
  else if (/text|message|waitlist|inquir/.test(L)) body = `<section class="panel"><h2>${esc(b.side2.title)}</h2>${b.side2.rows.map(r=>`<div class="rowx"><span><strong>${esc(r[0])}</strong><small>${esc(r[1])}</small></span><button type="button" class="lnk">Reply</button></div>`).join('')}</section>`;
  else if (/suppl|equipment|material|product|vaccine|permit|open items|stock|deal/.test(L)) body = `<section class="panel"><h2>${esc(b.side.title)}</h2>${b.side.rows.concat(s.stock).map(r=>`<div class="rowx"><span>${esc(r[0])}</span>${lvlBadge(r[2],r[1])}</div>`).join('')}${s.addOpen==='stock'?stockForm():`<button type="button" class="btn" style="align-self:flex-start" data-act="openAdd" data-v="stock">+ Add</button>`}</section>`;
  else if (/checklist|formula/.test(L)) body = Object.entries(b.phone.sections).map(([k,xs])=>`<section class="panel"><h2>${esc(k)}</h2>${xs.map(x=>`<div class="rowx"><span>${esc(x[0])}</span>${x[1]?'<span class="bdg" style="background:#FFF3CC;color:#6E4D00">Photo needed</span>':''}</div>`).join('')}</section>`).join('') + `<button type="button" class="btn" style="align-self:flex-start">+ New checklist</button>`;
  else if (/setting/.test(L)) body = `<section class="panel"><h2>Your features</h2>${['Reminder texts','Online booking + quotes','Review requests','Card payments + auto-charge','Customer portal','Crew phones'].map((f,i)=>{const on=!(s.off||{})[i];return `<div class="sw"><span>${f}</span><button type="button" class="chip" data-act="toggle" data-v="${i}" aria-pressed="${on}" style="${on?`background:${b.accent};border-color:${b.accent};color:#fff`:''}">${on?'On':'Off'}</button></div>`}).join('')}</section>`;
  else {
    const cta = /book|appoint|bid|commission|job|quote|dashboard/.test(L) ? `<button type="button" class="btn" data-act="view" data-v="cust">See what the customer sees</button>` : '';
    body = `<section class="panel"><div class="rowx" style="flex-wrap:wrap"><h2>${esc(label)}</h2><div class="chips">${cta}<button type="button" class="btn ghost" data-act="openAdd" data-v="job">+ Add</button></div></div>${s.addOpen==='job'?addForm(b):''}<div style="overflow-x:auto"><table class="sec-table"><thead><tr><th>Name</th><th>Where</th><th>Type</th><th>Team</th><th>Status</th></tr></thead><tbody>${allItems(b,s).map(i=>`<tr><td><strong>${esc(i[1])}</strong></td><td>${esc(i[2])}</td><td>${badgeFor(b,i[3])}</td><td>${esc(i[4])}</td><td>${esc(i[6])}</td></tr>`).join('')}</tbody></table></div></section>`;
  }
  return `<div class="main"><div class="hd"><div><p>${esc(b.name)}</p><h1>${esc(label)}</h1></div>${back}</div>${body}<p style="margin:0;font-size:14px;color:var(--muted)">Sample screen. The real one is built around this business.</p></div>`;
}

function renderPhone(b, s){
  const p = b.phone, secs = Object.keys(p.sections);
  const all = secs.flatMap(k => p.sections[k].map((x, i) => ({ photo:x[1], v:s.phone[k][i] })));
  const done = all.filter(x => p.mode === 'rate' ? x.v : x.v).length;
  const photosLeft = all.filter(x => x.photo && !x.v).length;
  const counts = { g:0, y:0, r:0 }; if (p.mode === 'rate') all.forEach(x => { if (x.v) counts[x.v]++; });
  const tabs = secs.map(k => { const d = s.phone[k].filter(Boolean).length; const on = s.sec === k;
    return `<button type="button" class="chip" data-act="sec" data-v="${esc(k)}" aria-pressed="${on}" style="${on?`background:${b.accent};border-color:${b.accent};color:#fff`:''}">${esc(k)} ${d}/${p.sections[k].length}</button>`; }).join('');
  const rows = p.sections[s.sec].map((x, i) => {
    const v = s.phone[s.sec][i];
    if (p.mode === 'rate') {
      const btn = l => `<button type="button" class="rb" data-act="rate" data-i="${i}" data-v="${l}" aria-pressed="${v===l}" style="${v===l?`background:${LV[l].bg};border-color:${LV[l].bd};color:${LV[l].fg}`:''}">${LV[l].t}</button>`;
      return `<div class="rate" style="${v?`background:${LV[v].bg};border-color:${LV[v].bd}`:''}"><span class="tx">${esc(x[0])}</span><div class="rbtns" role="group" aria-label="${esc(x[0])}">${btn('g')}${btn('y')}${btn('r')}</div>${(v==='y'||v==='r')?'<span style="font-size:13px;font-weight:700;color:#6E4D00">Add a photo and a short note</span>':''}</div>`;
    }
    return `<div class="task"><button type="button" class="box" data-act="check" data-i="${i}" aria-pressed="${!!v}" aria-label="${esc(x[0])}" style="${v?`background:${b.accent};border-color:${b.accent}`:''}">${v?'✓':''}</button><span class="tx${v?' done':''}">${esc(x[0])}</span>${x[1]&&has(s,'photos')?`<span class="cam" style="${v?'background:#E3F1E7;color:#1F5C38':'background:#FFF3CC;color:#6E4D00'}">${v?'Photo added':'Photo needed'}</span>`:''}</div>`;
  }).join('');
  const head = p.mode === 'rate'
    ? `<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:13px;font-weight:800">${['g','y','r'].map(l=>`<span style="padding:4px 10px;border-radius:999px;background:${LV[l].bg};color:${LV[l].fg}">${LV[l].t.split(' ')[0]} ${counts[l]} ${l==='g'?'good':l==='y'?'watch':'fix now'}</span>`).join('')}</div>`
    : `<div class="ph-prog"><div style="width:${Math.round(done/all.length*100)}%"></div></div><span style="font-weight:700;font-size:13px">${done} of ${all.length} done · ${photosLeft} photos still needed</span>`;
  return `<div class="phonestage"><div class="phone"><div class="screen">
      <div class="ph-top" style="background:${b.accent}"><b>${esc(p.title)}</b><span>${esc(p.sub)}</span>${head}</div>
      <div class="tabs" role="group" aria-label="Sections">${tabs}</div>
      <div class="ph-body">${rows}<div class="ph-note">${esc(p.note)}</div></div>
      <div class="ph-foot">${s.sent?`<span class="ok">${esc(p.sent)}</span>`:''}<button type="button" class="big" data-act="finish">${esc(p.finish)}</button></div>
    </div></div>
    <div class="side-note"><h3>${esc(b.phoneLabel)}</h3><p>${p.mode==='rate'?'Mark every item Good, Watch or Fix now. Yellow and red ask for a photo. Red items text the owner right away when the report goes out.':'Tap the boxes to check items off. Items marked "Photo needed" go into the customer\'s photo report.'}</p><p>Switch sections with the buttons at the top of the phone.</p><button type="button" class="btn ghost" data-act="reset">Start over</button></div></div>`;
}

function bookPrice(c, s){
  let price = 0, off = 0;
  c.groups.forEach((g, i) => {
    if (g.kind === 'one') price += g.options[s.cust[i]][1];
    if (g.kind === 'count') g.items.forEach((x, j) => price += (s.cust[i][j] - x[2]) * x[1]);
    if (g.kind === 'multi') g.options.forEach((o, j) => { if (s.cust[i][j]) price += o[1]; });
    if (g.kind === 'freq') off = g.options[s.cust[i]][1];
  });
  return { price:Math.max(0, Math.round(price * (1 - off))), freq:c.groups.find(g=>g.kind==='freq') };
}
function renderCust(b, s){
  const c = b.customer, a = b.accent;
  const on = x => x ? `background:${a};border-color:${a};color:#fff` : '';
  let body = '', foot = '';
  if (c.mode === 'book') {
    body = c.groups.map((g, i) => {
      if (g.kind === 'freq' && !has(s,'recurring')) return '';
      if (g.kind === 'one' || g.kind === 'freq') return `<div class="grp"><span>${esc(g.label)}</span><div class="opts">${g.options.map((o,j)=>`<button type="button" class="opt" data-act="one" data-g="${i}" data-i="${j}" aria-pressed="${s.cust[i]===j}" style="${on(s.cust[i]===j)}">${esc(o[0])}${g.kind==='freq'&&o[1]?` · ${Math.round(o[1]*100)}% off`:''}</button>`).join('')}</div></div>`;
      if (g.kind === 'count') return `<div class="opts">${g.items.map((x,j)=>{const n=s.cust[i][j];return `<div class="cnt"><span>${n} ${esc(x[0])}${n===1?'':'s'}</span><span style="display:flex;gap:4px"><button type="button" data-act="cnt" data-g="${i}" data-i="${j}" data-v="-1" aria-label="Fewer">−</button><button type="button" data-act="cnt" data-g="${i}" data-i="${j}" data-v="1" aria-label="More">+</button></span></div>`;}).join('')}</div>`;
      if (g.kind === 'multi') return `<div class="grp"><span>${esc(g.label)}</span><div class="chips">${g.options.map((o,j)=>`<button type="button" class="opt" data-act="multi" data-g="${i}" data-i="${j}" aria-pressed="${s.cust[i][j]}" style="${on(s.cust[i][j])}">${esc(o[0])}${o[1]?` +$${o[1]}`:''}</button>`).join('')}</div></div>`;
      return '';
    }).join('');
    const r = bookPrice(c, s); const fi = c.groups.indexOf(r.freq);
    const note = !r.freq || r.freq.options[s.cust[fi]][1] === 0 ? 'Your price' : 'Each visit · ' + r.freq.options[s.cust[fi]][0].toLowerCase();
    foot = `<div class="price"><span>${esc(note)}</span><b style="color:${a}">${money(r.price)}</b></div>${s.done?`<span class="ok">${esc(c.done)}</span>`:''}<button type="button" class="big" data-act="book">${esc(c.cta)}</button>`;
  }
  if (c.mode === 'portal') {
    const total = c.choices[s.cust.choice][1] + c.extras.reduce((t,x,i)=>t+(s.cust.extras[i]?x[1]:0),0);
    body = `<div class="grp"><span>Pick an option</span>${c.choices.map((o,j)=>`<button type="button" class="opt" style="text-align:left;display:flex;justify-content:space-between;${on(s.cust.choice===j)}" data-act="choice" data-i="${j}" aria-pressed="${s.cust.choice===j}"><span>${esc(o[0])}</span><span>${money(o[1])}</span></button>`).join('')}</div>
      <div class="grp"><span>Add on</span><div class="chips">${c.extras.map((x,j)=>`<button type="button" class="opt" data-act="extra" data-i="${j}" aria-pressed="${s.cust.extras[j]}" style="${on(s.cust.extras[j])}">${esc(x[0])} +${money(x[1])}</button>`).join('')}</div></div>
      <div><div class="line"><span>Total</span><strong>${money(total)}</strong></div><div class="line"><span>Deposit today (${Math.round(c.deposit*100)}%)</span><strong>${money(total*c.deposit)}</strong></div></div>
      <label class="grp" for="sig"><span>Type your name to sign</span><input id="sig" class="sig" data-act="sig" value="${esc(s.sig)}" placeholder="Your name" autocomplete="name"></label>`;
    foot = `${s.done?`<span class="ok">${esc(c.done)}</span>`:''}<button type="button" class="big" data-act="book">${esc(c.cta)}</button>`;
  }
  if (c.mode === 'deal') {
    const lv = d => d==='done' ? ['#E3F1E7','#1F5C38','✓ Done'] : d==='soon' ? ['#FFF3CC','#6E4D00','Coming up'] : ['#EDEAE3','#55605F','Later'];
    body = `<div style="background:${a};color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;font-weight:700;opacity:.9">Days to closing</span><b style="font-family:var(--display);font-size:44px;line-height:1">${c.days}</b><span style="font-size:14px">${esc(c.home)}</span></div>
      <div class="grp"><span>Your deadlines</span>${c.deadlines.map(d=>{const x=lv(d[2]);return `<div class="lrow"><span class="bdg" style="background:${x[0]};color:${x[1]}">${x[2]}</span><span style="flex:1">${esc(d[0])}</span><strong>${esc(d[1])}</strong></div>`}).join('')}</div>
      <div class="grp"><span>To sign</span>${c.docs.map((d,j)=>`<div class="lrow"><span style="flex:1">${esc(d)}</span><button type="button" class="lnk" data-act="signdoc" data-i="${j}" style="${s.signed[j]?'background:#E3F1E7;border-color:#2E7D4F;color:#1F5C38':''}">${s.signed[j]?'Signed ✓':'Sign'}</button></div>`).join('')}</div>
      <div class="grp"><span>Showings</span>${c.showings.map(x=>`<div class="lrow"><strong>${esc(x[0])}</strong><span style="flex:1">${esc(x[1])}</span></div>`).join('')}</div>`;
    foot = `<button type="button" class="big" style="background:${a}">Text Jenna</button>`;
  }
  if (c.mode === 'report') {
    const n = l => c.list.filter(x => x[0]===l).length;
    const alertBox = (l, x) => `<div class="alert" style="border-color:${LV[l].bd}"><div class="ah" style="background:${LV[l].bg};color:${LV[l].fg}">${LV[l].t}</div><div class="ab"><div class="ph-photo">[photo]</div><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span><div class="chips">${x[2].map((t,k)=>`<button type="button" class="lnk" style="${k===0?'background:#C2533F;border-color:#C2533F;color:#fff':''}">${esc(t)}</button>`).join('')}</div></div></div>`;
    const list = c.list.filter(x => s.filter==='all' || x[0]===s.filter);
    const fchip = (id, label) => `<button type="button" class="chip" data-act="filter" data-v="${id}" aria-pressed="${s.filter===id}" style="${on(s.filter===id)}">${label}</button>`;
    body = `<div style="font-size:13px;font-weight:700;color:${a}">${esc(c.gps)}</div>
      <div class="sum">${['g','y','r'].map(l=>`<div style="background:${LV[l].bg};color:${LV[l].fg}"><b>${n(l)}</b>${LV[l].t}</div>`).join('')}</div>
      ${alertBox('r', c.red)}${alertBox('y', c.yellow)}
      <div class="rowx" style="flex-wrap:wrap"><strong>Everything checked</strong><div class="chips">${fchip('all','All')}${fchip('r','Fix')}${fchip('y','Watch')}${fchip('g','Good')}</div></div>
      ${list.map(x=>`<div class="lrow">${lvlBadge(x[0])}<span style="flex:1">${esc(x[1])}</span>${x[2]?'<span style="width:40px;height:30px;border-radius:6px;background:#E4DED0" role="img" aria-label="Photo"></span>':''}</div>`).join('')}`;
    foot = `<button type="button" class="big" style="background:${a}">See all photos in my portal</button>`;
  }
  return `<div class="phonestage"><div class="phone"><div class="screen">
      <div class="cust-h"><span class="mono" style="background:${a}">${esc(b.short)}</span><span><b>${esc(c.title)}</b><small>${esc(c.sub || b.name)}</small></span></div>
      <div class="ph-body" style="gap:12px;padding:12px 14px">${body}</div>
      <div class="ph-foot">${foot}</div>
    </div></div>
    <div class="side-note"><h3>${esc(b.custLabel)}</h3><p>${c.mode==='deal'?'Buyers open one link to see every deadline, sign papers and check their showings, so they stop texting "where are we at?"':c.mode==='book'?'The page their customer opens from the website or a text. Tap the choices and watch the price change.':c.mode==='portal'?'The customer picks an option, signs with their name and pays the deposit, all from one link.':'The report goes out by email and in the portal the moment the visit is finished. Use the buttons to show only red, yellow or green items.'}</p><p>${esc(b.why)}</p><button type="button" class="btn ghost" data-act="reset">Start over</button></div></div>`;
}

const $ = id => document.getElementById(id);
function render(){
  const b = B[cur], s = st(cur);
  if (LOCK) { $('picker').innerHTML = `<a class="pick" href="index.html" style="text-decoration:none">← All businesses</a><span class="pick" aria-current="page" style="border-color:var(--ink)"><i style="background:${B[cur].accent}"></i>${esc(B[cur].label)}: ${esc(B[cur].name)}</span>`; } else
  $('picker').innerHTML = ORDER.map(id => `<button type="button" class="pick" data-act="biz" data-v="${id}" aria-pressed="${id===cur}"><i style="background:${B[id].accent}"></i>${esc(B[id].label)}</button>`).join('');
  const vl = { desk:"Owner's desk", phone:b.phoneLabel, cust:b.custLabel };
  $('views').innerHTML = Object.entries(vl).map(([k,l]) => `<button type="button" class="view" data-act="view" data-v="${k}" aria-pressed="${view===k}">${esc(l)}</button>`).join('');
  $('feats').innerHTML = `<h2>Pick what you want</h2><p>Every plan includes the basics. Tap to add or remove extras and watch the screens change.</p><div class="chips">${CORE.map(c=>`<span class="fchip inc"><span class="dot" style="background:#9AA19F;border-color:#9AA19F">✓</span>${esc(c)}</span>`).join('')}</div><div class="chips">${FEATS.map(([id,l,d])=>{const o=has(s,id);return `<button type="button" class="fchip" data-act="feat" data-v="${id}" aria-pressed="${o}" title="${esc(d)}" style="${o?`border-color:${b.accent}`:''}"><span class="dot" style="${o?`background:${b.accent};border-color:${b.accent}`:''}">${o?'✓':''}</span>${esc(l)}</button>`}).join('')}<button type="button" class="fchip" data-act="resetAll" style="border-style:dashed">Start over with sample data</button></div>`;
  $('stage').innerHTML = view === 'desk' ? renderDesk(b, s) : view === 'phone' ? renderPhone(b, s) : renderCust(b, s);
  $('notesFor').textContent = `Notes for ${b.label} · ${vl[view]}. They stay in this browser only.`;
  $('noteBox').value = notes[cur + ':' + view] || '';
}

let notes = {};
try { notes = JSON.parse(localStorage.getItem('portals-demo-notes') || '{}') || {}; } catch (e) { notes = {}; }
function saveNotes(){ try { localStorage.setItem('portals-demo-notes', JSON.stringify(notes)); $('savedMsg').textContent = 'Saved'; } catch (e) { $('savedMsg').textContent = 'Could not save in this browser. Copy your notes before closing.'; } }
function allNotesText(){
  const vl = (id, v) => v === 'desk' ? "Owner's desk" : v === 'phone' ? B[id].phoneLabel : B[id].custLabel;
  return ORDER.flatMap(id => ['desk','phone','cust'].map(v => { const t = (notes[id+':'+v]||'').trim(); return t ? `${B[id].label} · ${vl(id,v)}:\n${t}` : ''; })).filter(Boolean).join('\n\n') || 'No notes yet.';
}

$('noteBox').addEventListener('input', e => { notes[cur + ':' + view] = e.target.value; saveNotes(); if (!$('allNotes').hidden) $('allNotes').textContent = allNotesText(); });
$('showAll').addEventListener('click', () => { const el = $('allNotes'); el.hidden = !el.hidden; el.textContent = allNotesText(); $('showAll').textContent = el.hidden ? 'Show all notes' : 'Hide all notes'; });
$('copyAll').addEventListener('click', () => {
  const t = allNotesText();
  const fallback = () => { const el = $('allNotes'); el.hidden = false; el.textContent = t; const r = document.createRange(); r.selectNodeContents(el); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); $('savedMsg').textContent = 'Selected. Press copy on your keyboard.'; };
  try { navigator.clipboard.writeText(t).then(() => { $('savedMsg').textContent = 'Copied! Paste it to Claude.'; }, fallback); } catch (e) { fallback(); }
});
$('notesToggle').addEventListener('click', () => { const n = $('notes'); n.hidden = !n.hidden; $('notesToggle').textContent = n.hidden ? 'Show notes' : 'Hide notes'; $('notesToggle').setAttribute('aria-expanded', String(!n.hidden)); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, v = el.dataset.v, b = B[cur], s = st(cur);
  const g = +el.dataset.g, i = +el.dataset.i;
  if (a === 'biz') { cur = v; try { history.replaceState(null, '', '#' + v); } catch (x) {} }
  else if (a === 'view') view = v;
  else if (a === 'team') s.team = v;
  else if (a === 'nav') { s.nav = +v; view = 'desk'; }
  else if (a === 'toggle') s.off[v] = !s.off[v];
  else if (a === 'feat') { s.feat[v] = !has(s, v); if (s.nav && !has(s, featOf(b.nav[s.nav][0]))) s.nav = 0; persist(); }
  else if (a === 'openAdd') s.addOpen = v || '';
  else if (a === 'saveAdd') { const nm = ($('fName').value || '').trim(); if (!nm) { $('fName').focus(); return; } s.added.push([($('fTime').value||'Any time').trim(), nm, ($('fWhere').value||'').trim() || '—', $('fType').value, $('fTeam').value, 0, 'New · just added']); s.addOpen = ''; persist(); }
  else if (a === 'saveStock') { const nm = ($('sName').value || '').trim(); if (!nm) { $('sName').focus(); return; } const l = $('sLvl').value; s.stock.push([nm, l==='g'?'Plenty':l==='y'?'Getting low':'Order now', l]); s.addOpen = ''; persist(); }
  else if (a === 'signdoc') s.signed[i] = !s.signed[i];
  else if (a === 'saveOpen') { const nm = ($('oName').value||'').trim(); if (!nm) { $('oName').focus(); return; } s.leads.unshift([nm, ($('oWant').value||'').trim() || 'Signed in at the open house', 'Open house', $('oAgent').value==='Yes' ? 'Has an agent' : 'New']); persist(); }
  else if (a === 'resetAll') { S[cur] = initState(b); persist(); }
  else if (a === 'sec') s.sec = v;
  else if (a === 'check') { s.phone[s.sec][i] = !s.phone[s.sec][i]; s.sent = false; }
  else if (a === 'rate') { s.phone[s.sec][i] = s.phone[s.sec][i] === v ? '' : v; s.sent = false; }
  else if (a === 'finish') s.sent = true;
  else if (a === 'one') { s.cust[g] = i; s.done = false; }
  else if (a === 'cnt') { const x = b.customer.groups[g].items[i]; s.cust[g][i] = Math.min(8, Math.max(x[2], s.cust[g][i] + (+v))); s.done = false; }
  else if (a === 'multi') { s.cust[g][i] = !s.cust[g][i]; s.done = false; }
  else if (a === 'choice') { s.cust.choice = i; s.done = false; }
  else if (a === 'extra') { s.cust.extras[i] = !s.cust.extras[i]; s.done = false; }
  else if (a === 'book') s.done = true;
  else if (a === 'filter') s.filter = v;
  else if (a === 'reset') S[cur] = initState(b);
  else return;
  render();
});
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.act === 'sig') st(cur).sig = e.target.value; });

function fromHash(){ if (LOCK) return; const h = (location.hash || '').slice(1); if (B[h]) cur = h; }
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render();
</script>

</body>
</html>
